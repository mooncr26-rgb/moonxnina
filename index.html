<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Downloader</title>
<style>
  :root{
    --bg:#0d0f14;
    --card:#171a21;
    --card-border:#262b35;
    --text:#e8eaed;
    --muted:#8b93a3;
    --accent:#3b82f6;
    --accent-hover:#2f6fdb;
    --ok:#22c55e;
    --err:#ef4444;
    --tag:#f59e0b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px 16px 80px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px;}
  p.sub{color:var(--muted);margin:0 0 20px;font-size:14px;}
  .input-row{display:flex;gap:8px;margin-bottom:24px;}
  input[type=text]{
    flex:1;
    padding:13px 14px;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:var(--card);
    color:var(--text);
    font-size:14px;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}
  button.primary{
    padding:13px 20px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  button.primary:hover{background:var(--accent-hover);}
  button.primary:disabled{opacity:.5;cursor:default;}

  .section-title{
    font-size:13px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin:22px 0 10px;
  }
  .video-title{font-size:15px;font-weight:600;margin:0 0 14px;color:var(--text);}

  .card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .play-dot{
    width:34px;height:34px;border-radius:50%;
    background:#222736;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    color:var(--accent);
    font-size:14px;
  }
  .meta{flex:1;min-width:0;}
  .meta .name{
    font-size:13px;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:4px;
  }
  .meta .row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);}
  .badge{
    background:var(--tag);
    color:#1a1300;
    font-weight:700;
    font-size:11px;
    padding:2px 7px;
    border-radius:5px;
  }
  .dl-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
    white-space:nowrap;
  }
  .dl-btn:hover{background:var(--accent-hover);}
  .dl-btn:disabled{opacity:.6;cursor:default;}

  .status{font-size:13px;margin-top:6px;}
  .status.err{color:var(--err);}
  .status.ok{color:var(--ok);}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:40px 0;}
  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    display:inline-block;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <h1>ვიდეო / აუდიო ჩამოტვირთვა</h1>
  <p class="sub">ჩასვი YouTube ან TikTok ბმული — გამოჩნდება ყველა ხელმისაწვდომი ვერსია.</p>

  <div class="input-row">
    <input id="urlInput" type="text" placeholder="https://youtube.com/watch?v=..." />
    <button class="primary" id="analyzeBtn" onclick="analyze()">ძებნა</button>
  </div>

  <div id="results"></div>
</div>

<script>
const API = ''; // იმავე დომენზეა Flask-ი, თუ ცალკეა — ჩაწერე backend-ის URL

function fmtSize(bytes){
  if(!bytes) return '';
  const mb = bytes / (1024*1024);
  if(mb < 1024) return mb.toFixed(1) + ' MB';
  return (mb/1024).toFixed(2) + ' GB';
}

async function analyze(){
  const url = document.getElementById('urlInput').value.trim();
  const results = document.getElementById('results');
  const btn = document.getElementById('analyzeBtn');
  if(!url){ return; }

  btn.disabled = true;
  results.innerHTML = '<div class="empty"><span class="spinner"></span> ვამოწმებ ბმულს...</div>';

  try{
    const res = await fetch(API + '/api/formats', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();

    if(!res.ok || data.error){
      results.innerHTML = `<div class="empty status err">${data.error || 'ვერ მოხერხდა ბმულის დამუშავება'}</div>`;
      return;
    }

    renderResults(url, data);
  }catch(e){
    results.innerHTML = '<div class="empty status err">სერვერთან კავშირი ვერ მოხერხდა.</div>';
  }finally{
    btn.disabled = false;
  }
}

function renderResults(url, data){
  const results = document.getElementById('results');
  let html = `<div class="video-title">${escapeHtml(data.title || 'მედია ფაილი')}</div>`;

  if(data.video && data.video.length){
    html += `<div class="section-title">ვიდეო (MP4)</div>`;
    data.video.forEach((f, i) => {
      const id = `v_${i}`;
      html += card(id, f.quality, f.ext, f.filesize, f.has_audio ? null : 'საჭიროა გაერთიანება');
    });
  }

  if(data.audio && data.audio.length){
    html += `<div class="section-title">აუდიო (MP3)</div>`;
    data.audio.forEach((f, i) => {
      const id = `a_${i}`;
      html += card(id, f.quality, 'MP3', f.filesize, null);
    });
  }

  if(!data.video?.length && !data.audio?.length){
    html += '<div class="empty">ამ ბმულისთვის ფორმატები ვერ მოიძებნა.</div>';
  }

  results.innerHTML = html;

  // wire up buttons
  (data.video || []).forEach((f, i) => {
    bindDownload(`v_${i}`, url, 'mp4', f.format_id, f.has_audio);
  });
  (data.audio || []).forEach((f, i) => {
    bindDownload(`a_${i}`, url, 'mp3', f.format_id, true);
  });
}

function card(id, quality, ext, filesize, note){
  return `
    <div class="card">
      <div class="play-dot">▶</div>
      <div class="meta">
        <div class="name">${ext?.toUpperCase() || ''} ${filesize ? '• ' + fmtSize(filesize) : ''}</div>
        <div class="row">
          <span class="badge">${quality}</span>
          ${note ? `<span>${note}</span>` : ''}
        </div>
        <div class="status" id="status_${id}"></div>
      </div>
      <button class="dl-btn" id="btn_${id}">ჩამოტვირთვა</button>
    </div>`;
}

function bindDownload(id, url, type, format_id, has_audio){
  const btn = document.getElementById(`btn_${id}`);
  const status = document.getElementById(`status_${id}`);
  btn.onclick = async () => {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    status.textContent = 'მუშავება...';
    status.className = 'status';

    try{
      const res = await fetch(API + '/api/download', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({url, type, format_id, has_audio})
      });
      const {task_id, error} = await res.json();
      if(error){ throw new Error(error); }

      await poll(task_id, status);
      window.location.href = API + `/api/get_file/${task_id}`;
      status.textContent = 'მზადაა!';
      status.className = 'status ok';
    }catch(e){
      status.textContent = e.message || 'შეცდომა მოხდა';
      status.className = 'status err';
    }finally{
      btn.disabled = false;
      btn.textContent = 'ჩამოტვირთვა';
    }
  };
}

function poll(task_id, status){
  return new Promise((resolve, reject) => {
    const iv = setInterval(async () => {
      try{
        const res = await fetch(API + `/api/progress/${task_id}`);
        const data = await res.json();
        if(data.status === 'completed'){
          clearInterval(iv);
          resolve();
        }else if(data.status === 'failed'){
          clearInterval(iv);
          reject(new Error(data.error || 'ჩამოტვირთვა ვერ მოხერხდა'));
        }
      }catch(e){
        clearInterval(iv);
        reject(e);
      }
    }, 1500);
  });
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
</script>
</body>
</html>
