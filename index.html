<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOONNINA DOWNLOADER</title>
<style>
  :root{
    --bg-1:#0f0c29;
    --bg-2:#1a1340;
    --card:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.10);
    --text:#f1eefc;
    --muted:#a3a0c2;

    --grad-1:#ff5fa2;
    --grad-2:#a35bff;
    --grad-3:#4f8cff;

    --hd:#ff7a45;
    --hd-bg:rgba(255,122,69,0.16);
    --mid:#4f8cff;
    --mid-bg:rgba(79,140,255,0.16);
    --low:#34d399;
    --low-bg:rgba(52,211,153,0.16);
    --audio:#c084fc;
    --audio-bg:rgba(192,132,252,0.16);

    --ok:#34d399;
    --err:#ff6b8a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(163,91,255,0.35), transparent 45%),
      radial-gradient(circle at 100% 20%, rgba(79,140,255,0.30), transparent 40%),
      radial-gradient(circle at 20% 100%, rgba(255,95,162,0.25), transparent 45%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:32px 16px 90px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  h1{
    font-size:26px;
    margin:0 0 4px;
    font-weight:800;
    background:linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    background-size:200% auto;
    animation:shine 6s linear infinite;
  }
  @keyframes shine{
    to{background-position:200% center;}
  }
  p.sub{color:var(--muted);margin:0 0 24px;font-size:14px;}

  .input-row{display:flex;gap:10px;margin-bottom:26px;}
  input[type=text]{
    flex:1;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid var(--card-border);
    background:rgba(255,255,255,0.06);
    color:var(--text);
    font-size:14px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input[type=text]::placeholder{color:#7d79a3;}
  input[type=text]:focus{
    border-color:var(--grad-2);
    box-shadow:0 0 0 3px rgba(163,91,255,0.25);
  }
  button.primary{
    padding:14px 22px;
    border-radius:14px;
    border:none;
    background:linear-gradient(135deg, var(--grad-1), var(--grad-2));
    color:#fff;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(163,91,255,0.35);
    transition:transform .15s, box-shadow .15s;
  }
  button.primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(163,91,255,0.45);}
  button.primary:active{transform:translateY(0);}
  button.primary:disabled{opacity:.5;cursor:default;box-shadow:none;}

  .section-title{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:24px 0 12px;
  }
  .video-title{
    font-size:16px;
    font-weight:700;
    margin:4px 0 6px;
    color:var(--text);
  }

  .card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:13px 14px;
    margin-bottom:11px;
    backdrop-filter:blur(6px);
    transition:border-color .2s, transform .15s;
  }
  .card:hover{border-color:rgba(255,255,255,0.22);transform:translateY(-1px);}

  .play-dot{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-size:14px;
    color:#fff;
  }
  .play-dot.hd{background:linear-gradient(135deg,#ff7a45,#ff5fa2);}
  .play-dot.mid{background:linear-gradient(135deg,#4f8cff,#a35bff);}
  .play-dot.low{background:linear-gradient(135deg,#34d399,#4f8cff);}
  .play-dot.audio{background:linear-gradient(135deg,#c084fc,#ff5fa2);}

  .meta{flex:1;min-width:0;}
  .meta .name{
    font-size:13px;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:5px;
  }
  .meta .row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;}

  .badge{
    font-weight:800;
    font-size:11px;
    padding:3px 9px;
    border-radius:7px;
  }
  .badge.hd{color:var(--hd);background:var(--hd-bg);}
  .badge.mid{color:var(--mid);background:var(--mid-bg);}
  .badge.low{color:var(--low);background:var(--low-bg);}
  .badge.audio{color:var(--audio);background:var(--audio-bg);}

  .dl-btn{
    background:linear-gradient(135deg, var(--grad-2), var(--grad-3));
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
    white-space:nowrap;
    box-shadow:0 4px 14px rgba(79,140,255,0.30);
    transition:transform .15s, box-shadow .15s;
  }
  .dl-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(79,140,255,0.4);}
  .dl-btn:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none;}

  .status{font-size:12px;margin-top:5px;font-weight:600;}
  .status.err{color:var(--err);}
  .status.ok{color:var(--ok);}

  .empty{color:var(--muted);font-size:14px;text-align:center;padding:48px 0;}
  .empty.err{color:var(--err);}

  .spinner{
    width:15px;height:15px;border-radius:50%;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    display:inline-block;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <h1>MOONNINA DOWNLOADER</h1>
  <p class="sub">ჩასვი YouTube ან TikTok ბმული — გამოჩნდება ყველა ხელმისაწვდომი ვერსია.</p>

  <div class="input-row">
    <input id="urlInput" type="text" placeholder="https://youtube.com/watch?v=..." />
    <button class="primary" id="analyzeBtn" onclick="analyze()">ძებნა</button>
  </div>

  <div id="results"></div>
</div>

<script>
const API = ''; // იმავე დომენზეა Flask-ი, თუ ცალკეა — ჩაწერე backend-ის URL

function fmtSize(bytes){
  if(!bytes) return '';
  const mb = bytes / (1024*1024);
  if(mb < 1024) return mb.toFixed(1) + ' MB';
  return (mb/1024).toFixed(2) + ' GB';
}

function tierFor(qualityStr, isAudio){
  if(isAudio) return 'audio';
  const n = parseInt(String(qualityStr).replace(/[^0-9]/g, ''), 10) || 0;
  if(n >= 1080) return 'hd';
  if(n >= 540) return 'mid';
  return 'low';
}

async function analyze(){
  const url = document.getElementById('urlInput').value.trim();
  const results = document.getElementById('results');
  const btn = document.getElementById('analyzeBtn');
  if(!url){ return; }

  btn.disabled = true;
  results.innerHTML = '<div class="empty"><span class="spinner"></span> ვამოწმებ ბმულს...</div>';

  try{
    const res = await fetch(API + '/api/formats', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();

    if(!res.ok || data.error){
      results.innerHTML = `<div class="empty err">${escapeHtml(data.error || 'ვერ მოხერხდა ბმულის დამუშავება')}</div>`;
      return;
    }

    renderResults(url, data);
  }catch(e){
    results.innerHTML = '<div class="empty err">სერვერთან კავშირი ვერ მოხერხდა.</div>';
  }finally{
    btn.disabled = false;
  }
}

function renderResults(url, data){
  const results = document.getElementById('results');
  let html = `<div class="video-title">${escapeHtml(data.title || 'მედია ფაილი')}</div>`;

  if(data.video && data.video.length){
    html += `<div class="section-title">ვიდეო · MP4</div>`;
    data.video.forEach((f, i) => {
      html += card(`v_${i}`, f.quality, f.ext, f.filesize, f.has_audio ? null : 'საჭიროა გაერთიანება', false);
    });
  }

  if(data.audio && data.audio.length){
    html += `<div class="section-title">აუდიო · MP3</div>`;
    data.audio.forEach((f, i) => {
      html += card(`a_${i}`, f.quality, 'MP3', f.filesize, null, true);
    });
  }

  if(!data.video?.length && !data.audio?.length){
    html += '<div class="empty">ამ ბმულისთვის ფორმატები ვერ მოიძებნა.</div>';
  }

  results.innerHTML = html;

  (data.video || []).forEach((f, i) => {
    bindDownload(`v_${i}`, url, 'mp4', f.format_id, f.has_audio);
  });
  (data.audio || []).forEach((f, i) => {
    bindDownload(`a_${i}`, url, 'mp3', f.format_id, true);
  });
}

function card(id, quality, ext, filesize, note, isAudio){
  const tier = tierFor(quality, isAudio);
  return `
    <div class="card">
      <div class="play-dot ${tier}">▶</div>
      <div class="meta">
        <div class="name">${(ext || '').toUpperCase()} ${filesize ? '• ' + fmtSize(filesize) : ''}</div>
        <div class="row">
          <span class="badge ${tier}">${escapeHtml(String(quality))}</span>
          ${note ? `<span>${escapeHtml(note)}</span>` : ''}
        </div>
        <div class="status" id="status_${id}"></div>
      </div>
      <button class="dl-btn" id="btn_${id}">ჩამოტვირთვა</button>
    </div>`;
}

function bindDownload(id, url, type, format_id, has_audio){
  const btn = document.getElementById(`btn_${id}`);
  const status = document.getElementById(`status_${id}`);
  btn.onclick = async () => {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    status.textContent = 'მუშავება...';
    status.className = 'status';

    try{
      const res = await fetch(API + '/api/download', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({url, type, format_id, has_audio})
      });
      const {task_id, error} = await res.json();
      if(error){ throw new Error(error); }

      await poll(task_id, status);
      window.location.href = API + `/api/get_file/${task_id}`;
      status.textContent = 'მზადაა!';
      status.className = 'status ok';
    }catch(e){
      status.textContent = e.message || 'შეცდომა მოხდა';
      status.className = 'status err';
    }finally{
      btn.disabled = false;
      btn.textContent = 'ჩამოტვირთვა';
    }
  };
}

function poll(task_id, status){
  return new Promise((resolve, reject) => {
    const iv = setInterval(async () => {
      try{
        const res = await fetch(API + `/api/progress/${task_id}`);
        const data = await res.json();
        if(data.status === 'completed'){
          clearInterval(iv);
          resolve();
        }else if(data.status === 'failed'){
          clearInterval(iv);
          reject(new Error(data.error || 'ჩამოტვირთვა ვერ მოხერხდა'));
        }
      }catch(e){
        clearInterval(iv);
        reject(e);
      }
    }, 1500);
  });
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
</script>
</body>
</html>
