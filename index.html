<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOONNINA DOWNLOADER - YouTube & TikTok</title>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --accent: #38bdf8;
            --accent-hover: #0ea5e9; --text: #f8fafc; --text-muted: #94a3b8;
            --success: #22c55e; --error: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: 40px auto; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.5rem; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
        header p { color: var(--text-muted); font-size: 1.1rem; }
        
        .main-card { background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); margin-bottom: 40px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 16px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: var(--text); font-size: 1rem; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: var(--accent); }
        
        button { padding: 16px 30px; border-radius: 12px; border: none; background: var(--accent); color: #0f172a; font-weight: bold; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #334155; color: var(--text-muted); cursor: not-allowed; }

        .status-box { display: none; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; font-weight: 500; }
        .status-box.loading { display: block; background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.2); }
        .status-box.error { display: block; background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.2); }
        .status-box.success { display: block; background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.2); }

        .result-section { display: none; margin-top: 25px; text-align: center; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .result-title { margin-bottom: 20px; color: var(--text); font-size: 1.1rem; padding-bottom: 10px; border-bottom: 1px solid #334155;}
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .dl-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; border: 2px solid var(--accent); padding: 15px; color: var(--text); border-radius: 12px; text-decoration: none; transition: 0.2s; cursor: pointer; }
        .dl-btn:hover { background: rgba(56, 189, 248, 0.1); transform: translateY(-2px); }
        .dl-btn .format { font-size: 1.2rem; font-weight: bold; color: var(--accent); margin-bottom: 5px; }
        
        @media (max-width: 600px) { .input-group { flex-direction: column; } .btn-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MOONNINA DOWNLOADER</h1>
        <p>ულტრა-სწრაფი YouTube და TikTok კონვერტერი ლოდინის გარეშე.</p>
    </header>

    <div class="main-card">
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="ჩასვით YouTube ან TikTok ლინკი...">
            <button id="convertBtn" onclick="analyzeVideo()">ძებნა</button>
        </div>

        <div id="statusBox" class="status-box"></div>

        <div id="resultSection" class="result-section">
            <div id="videoTitle" class="result-title"></div>
            <div class="btn-grid" id="btnGrid"></div>
        </div>
    </div>
</div>

<script>
    async function analyzeVideo() {
        const url = document.getElementById('videoUrl').value.trim();
        const btn = document.getElementById('convertBtn');
        const status = document.getElementById('statusBox');
        const resultSec = document.getElementById('resultSection');
        const titleDiv = document.getElementById('videoTitle');
        const btnGrid = document.getElementById('btnGrid');

        if (!url) {
            status.className = 'status-box error';
            status.innerText = 'გთხოვთ ჩასვათ ლინკი!';
            return;
        }

        btn.disabled = true;
        resultSec.style.display = 'none';
        status.className = 'status-box loading';
        status.innerText = 'მიმდინარეობს ლინკების გენერაცია სერვერზე...';

        try {
            const res = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            const data = await res.json();

            if (!res.ok || data.error) {
                status.className = 'status-box error';
                status.innerText = data.error || 'მოხდა შეცდომა მონაცემების დამუშავებისას.';
                btn.disabled = false;
                return;
            }

            status.style.display = 'none';
            titleDiv.innerText = data.title;
            btnGrid.innerHTML = '';

            if (data.mp4) {
                btnGrid.innerHTML += `
                    <a href="${data.mp4}" target="_blank" class="dl-btn">
                        <span class="format">🎥 გადმოწერა (MP4)</span>
                        <span style="font-size:0.85rem; color:var(--text-muted)">ვიდეო ხმით (HD)</span>
                    </a>
                `;
            }
            if (data.mp3) {
                btnGrid.innerHTML += `
                    <a href="${data.mp3}" target="_blank" class="dl-btn" style="border-color: #22c55e;">
                        <span class="format" style="color: #22c55e;">🎵 გადმოწერა (MP3)</span>
                        <span style="font-size:0.85rem; color:var(--text-muted)">მხოლოდ აუდიო ფაილი</span>
                    </a>
                `;
            }

            resultSec.style.display = 'block';

        } catch (err) {
            status.className = 'status-box error';
            status.innerText = 'სერვერთან კავშირი გაწყდა.';
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
