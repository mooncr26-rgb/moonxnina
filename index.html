<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOONXNINA DOWNLOADER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #060213;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;
            perspective: 1000px;
            padding: 20px;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            z-index: 1;
            animation: float 8s infinite ease-in-out;
            opacity: 0.6;
        }
        .orb-1 {
            width: 250px; height: 250px;
            background: radial-gradient(circle, #ff007f, #7928ca);
            top: -10%; left: -10%;
        }
        .orb-2 {
            width: 250px; height: 250px;
            background: radial-gradient(circle, #00f2fe, #4facfe);
            bottom: -10%; right: -10%;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            background: linear-gradient(45deg, #00f2fe, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper { margin-bottom: 20px; }
        input {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: rgba(255, 255, 255, 0.07); color: white;
            font-size: 1rem; outline: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }
        input:focus { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }

        .main-btn {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, #7928ca, #ff007f); color: white;
            font-weight: bold; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 6px 0 #52168c; transition: 0.1s;
        }
        .main-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #52168c; }

        #status { margin-top: 20px; font-size: 0.95rem; color: #00f2fe; font-weight: 500; min-height: 24px; word-break: break-word; }

        .progress-container {
            display: none;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .progress-bar-bg {
            width: 100%; height: 12px; background: rgba(0, 0, 0, 0.4);
            border-radius: 6px; overflow: hidden; margin-top: 8px; position: relative;
        }
        .progress-bar-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #00f2fe, #ff007f);
            box-shadow: 0 0 10px #00f2fe;
            transition: width 0.2s ease;
        }

        .links { margin-top: 25px; display: flex; flex-direction: column; gap: 15px; }
        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 14px;
            font-weight: bold; font-size: 1rem; color: white; cursor: pointer;
            transition: all 0.1s ease;
        }
        .btn:disabled { background: #444 !important; box-shadow: none !important; cursor: not-allowed; opacity: 0.6; }
        
        .mp4 { background: linear-gradient(135deg, #00cdac, #02aab0); box-shadow: 0 6px 0 #01767a; }
        .mp4:not(:disabled):active { transform: translateY(4px); box-shadow: 0 2px 0 #01767a; }

        .mp3 { background: linear-gradient(135deg, #ffb300, #ff8000); box-shadow: 0 6px 0 #b35900; }
        .mp3:not(:disabled):active { transform: translateY(4px); box-shadow: 0 2px 0 #b35900; }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <h1>MOONXNINA DOWNLOADER</h1>
        <div class="input-wrapper">
            <input type="text" id="url" placeholder="ჩასვი ვიდეოს ბმული აქ...">
        </div>
        <button class="main-btn" id="searchBtn" onclick="analyze()">ვიდეოს მოძიება</button>
        
        <div id="status"></div>

        <div class="progress-container" id="progressContainer">
            <div style="display: flex; justify-content: space-between; color: white; font-size: 0.85rem;">
                <span id="progressState">ამუშავებს...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>
        
        <div id="links" class="links" style="display: none;">
            <button class="btn mp4" id="mp4Btn" onclick="startDownload('mp4')">🎬 გადმოწერე ორიგინალი MP4</button>
            <button class="btn mp3" id="mp3Btn" onclick="startDownload('mp3')">🎵 გადმოწერე მაღალი ხარისხის MP3</button>
        </div>
    </div>

    <script>
        let savedUrl = "";
        
        const serverUrl = window.location.protocol === 'file:' 
            ? "http://127.0.0.1:5000" 
            : window.location.origin;

        async function analyze() {
            const url = document.getElementById('url').value;
            const status = document.getElementById('status');
            const linksContainer = document.getElementById('links');
            
            if(!url) { status.innerText = "გთხოვთ ჩასვათ ბმული!"; return; }

            savedUrl = url;
            status.innerHTML = "🔄 კოსმოსური ანალიზი...";
            linksContainer.style.display = 'none';
            document.getElementById('progressContainer').style.display = 'none';
            
            try {
                const res = await fetch(`${serverUrl}/api/analyze`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url})
                });
                const data = await res.json();
                
                if(res.ok) {
                    status.innerHTML = "✨ მზად არის!<br><span style='color:white; font-size:0.9rem;'>" + data.title + "</span>";
                    linksContainer.style.display = 'flex';
                } else {
                    status.innerText = "❌ შეცდომა: " + (data.error || "ვერ მოიძებნა");
                }
            } catch (err) {
                status.innerText = "❌ სერვერთან კავშირი ვერ დამყარდა!";
            }
        }

        async function startDownload(type) {
            const status = document.getElementById('status');
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressBarFill');
            const progressPercent = document.getElementById('progressPercent');
            const progressState = document.getElementById('progressState');
            
            document.getElementById('mp4Btn').disabled = true;
            document.getElementById('mp3Btn').disabled = true;
            
            status.innerHTML = "";
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            progressPercent.innerText = '0%';
            progressState.innerText = 'სერვერი ემზადება...';

            try {
                const res = await fetch(`${serverUrl}/api/download`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url: savedUrl, type: type })
                });
                const initData = await res.json();
                const taskId = initData.task_id;

                const interval = setInterval(async () => {
                    const progRes = await fetch(`${serverUrl}/api/progress/${taskId}`);
                    const task = await progRes.json();
                    
                    if (task.status === 'downloading' || task.status === 'processing') {
                        progressState.innerText = 'იტვირთება სერვერზე...';
                        progressFill.style.width = task.progress + '%';
                        progressPercent.innerText = task.progress + '%';
                    } 
                    else if (task.status === 'completed') {
                        clearInterval(interval);
                        progressFill.style.width = '100%';
                        progressPercent.innerText = '100%';
                        progressState.innerText = '✨ მზად არის! გადმოაქვს მოწყობილობაზე...';
                        
                        window.location.href = `${serverUrl}/api/get_file/${taskId}`;
                        
                        setTimeout(() => {
                            progressContainer.style.display = 'none';
                            document.getElementById('mp4Btn').disabled = false;
                            document.getElementById('mp3Btn').disabled = false;
                            status.innerHTML = "🎉 გადმოწერა წარმატებით დაიწყო!";
                        }, 2000);
                    } 
                    else if (task.status === 'failed') {
                        clearInterval(interval);
                        progressContainer.style.display = 'none';
                        status.innerHTML = `❌ შეცდომა: ${task.error}`;
                        document.getElementById('mp4Btn').disabled = false;
                        document.getElementById('mp3Btn').disabled = false;
                    }
                }, 600);

            } catch (err) {
                status.innerHTML = "❌ კავშირის შეცდომა!";
                document.getElementById('mp4Btn').disabled = false;
                document.getElementById('mp3Btn').disabled = false;
            }
        }
    </script>
</body>
</html>
